name: Check Jarvis Memory UI

on:
  push:
    branches:
      - jarvis-memory-v1
    paths:
      - "components/JarvisShell.tsx"
      - "components/JarvisAuth.module.css"
      - "lib/jarvisCore.ts"
      - "lib/jarvisSession.ts"
      - ".github/workflows/check-jarvis-memory-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Enable direct 3D orb gesture rotation
        run: node scripts/patch-orb-for-gesture.mjs

      - name: Build static Jarvis client
        run: npm run build
